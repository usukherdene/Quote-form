<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <title></title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body class="flex">
    <form class="flex" action="">
        <div class="form-image"></div>
        <div class="form-section flex">
            <div class="form-cont flex">
                <div class="title flex">Get Tokyo Quote</div>
                <div class="text flex">All-inclusive Tokyo Package</div>
                <div class="name-s flex config">
                    <div class="name-t flex">Lead Passenger Name:</div>
                    <input class="int" type="name" placeholder="  Uchiha Itachi">
                </div>
                <div class="number-s flex config">
                    <div class="number-t flex">Enter Active Phone Number:</div>
                    <input class="int" type="number" placeholder="  +976 9911 5268">
                </div>
                <div class="email-s flex config">
                    <div class="email-t flex">Enter E-mail:</div>
                    <input class="int" type="email" placeholder="  your-email@example.com">
                </div>
                <div class="passenger-s flex config">
                    <div class="passenger-t flex">Total Passengers:</div>
                    <input class="int" type="passenger" placeholder="   i,e 2 adults % 2 kids">
                </div>
                <div class="policy flex">I accept the <span>Privacy & Policy</span><input type="checkbox"></div>
                <button class="submit" type="submit" >Submit</button>
            </div>
        </div>
    </form>
</body>
</html>
